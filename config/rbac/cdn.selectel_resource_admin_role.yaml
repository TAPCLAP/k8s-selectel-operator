# This rule is not used by the project selectel-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over cdn.selectel.tapclap.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: selectel-operator
    app.kubernetes.io/managed-by: kustomize
  name: cdn.selectel-resource-admin-role
rules:
- apiGroups:
  - cdn.selectel.tapclap.com
  resources:
  - resources
  verbs:
  - '*'
- apiGroups:
  - cdn.selectel.tapclap.com
  resources:
  - resources/status
  verbs:
  - get
