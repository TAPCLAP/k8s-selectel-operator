# This rule is not used by the project selectel-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to cdn.selectel.tapclap.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: selectel-operator
    app.kubernetes.io/managed-by: kustomize
  name: cdn.selectel-resource-viewer-role
rules:
- apiGroups:
  - cdn.selectel.tapclap.com
  resources:
  - resources
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cdn.selectel.tapclap.com
  resources:
  - resources/status
  verbs:
  - get
