name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    name: Publish image, chart, and GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Image coordinates
        id: coords
        run: |
          set -eu
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "repo=${repo}" >> "${GITHUB_OUTPUT}"
          echo "owner=${owner}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${repo}:${tag}" >> "${GITHUB_OUTPUT}"
          echo "chart=oci://ghcr.io/${owner}/charts/selectel-operator" >> "${GITHUB_OUTPUT}"
          echo "crd_chart=oci://ghcr.io/${owner}/charts/selectel-operator-crds" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the operator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.coords.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.coords.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package and push the Helm chart
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ steps.coords.outputs.repo }}
        run: |
          set -eu
          chart="helm/selectel-operator"
          sed -i "s|repository: .*|repository: ${IMAGE_REPOSITORY}|" "${chart}/values.yaml"
          helm package "${chart}" \
            --version "${{ steps.coords.outputs.version }}" \
            --app-version "${{ steps.coords.outputs.tag }}"
          helm package helm/selectel-operator-crds \
            --version "${{ steps.coords.outputs.version }}" \
            --app-version "${{ steps.coords.outputs.tag }}"
          echo "${{ github.token }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "selectel-operator-${{ steps.coords.outputs.version }}.tgz" "oci://ghcr.io/${{ steps.coords.outputs.owner }}/charts"
          helm push "selectel-operator-crds-${{ steps.coords.outputs.version }}.tgz" "oci://ghcr.io/${{ steps.coords.outputs.owner }}/charts"

      - name: Write the release notes
        run: |
          set -eu
          previous="$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"
          if [ -n "${previous}" ]; then
            changes="$(git log --no-merges --pretty=format:'- %s (%h)' "${previous}..HEAD")"
          else
            changes="$(git log --no-merges --pretty=format:'- %s (%h)')"
          fi
          if [ -z "${changes}" ]; then
            changes="- ${GITHUB_REF_NAME}"
          fi
          {
            echo "## Image"
            echo
            echo "\`${{ steps.coords.outputs.image }}\`"
            echo
            echo "## Charts"
            echo
            echo "- operator: \`${{ steps.coords.outputs.chart }}\` version \`${{ steps.coords.outputs.version }}\`. Includes the CRDs and the controller."
            echo "- CRDs only: \`${{ steps.coords.outputs.crd_chart }}\` version \`${{ steps.coords.outputs.version }}\`. The same CRDs, without the operator. Use this only when CRDs are installed separately."
            echo
            echo "## Install"
            echo
            echo "Installing the operator chart is enough, because that chart includes the CRDs. Install the CRD chart first only when CRDs are managed separately."
            echo
            echo '```bash'
            echo "helm install selectel-operator-crds \\"
            echo "  ${{ steps.coords.outputs.crd_chart }} \\"
            echo "  --version ${{ steps.coords.outputs.version }}"
            echo
            echo "helm install selectel-operator \\"
            echo "  ${{ steps.coords.outputs.chart }} \\"
            echo "  --version ${{ steps.coords.outputs.version }} \\"
            echo "  --namespace selectel-infra \\"
            echo "  --create-namespace"
            echo '```'
            echo
            echo "Put the Selectel credential Secret in \`selectel-infra\`. \`Project.spec.credentialsSecretRef.namespace\` must be that namespace."
            echo
            echo "## Changes"
            echo
            printf '%s\n' "${changes}"
          } > release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.coords.outputs.tag }}" \
            --title "${{ steps.coords.outputs.tag }}" \
            --notes-file release-notes.md
