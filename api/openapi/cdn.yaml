openapi: 3.0.0
info:
  contact: {}
  description: Managing CDN resources, cache tasks, SSL, and Let's Encrypt certificates.
  title: CDN API
  version: v0.0.1
paths:
  /cache/tasks:
    post:
      description: Creates a new cache task to delete or preload files in CDN cache.
      operationId: createCacheTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.Task'
        description: Cache task payload.
        required: true
      responses:
        '200':
          description: Request processed. See `task_id` field in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.CreateTaskResponse'
        '400':
          description: Bad request. Fix the request and try again.
        '403':
          description: Access is forbidden. Make sure you have the required rights.
        '422':
          description: Validation error. Fix the request and try again.
        '429':
          description: Too many requests. Please try again later.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Create cache task
      tags:
        - Cache
  /cache/tasks/{task_id}:
    get:
      description: Returns information about a specific cache task.
      operationId: getCacheTask
      parameters:
        - description: Task identifier.
          in: path
          name: task_id
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          description: Request processed. See `status` field in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.TaskResult'
        '400':
          description: Bad request. Fix the request and try again.
        '403':
          description: Access is forbidden. Make sure you have the required rights.
        '404':
          description: Task has not been found.
        '429':
          description: Too many requests. Please try again later.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Get cache task
      tags:
        - Cache
  /certificate:
    get:
      description: Returns a list of certificates for the account.
      operationId: listCertificates
      responses:
        '200':
          description: Request processed. See `status` field in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ListCertificatesResponse'
        '400':
          description: Bad request. Fix the request and try again.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: List certificates
      tags:
        - Certificates
    post:
      description: Creates a custom certificate for the account.
      operationId: createCertificate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.CreateCertificateRequest'
        description: Certificate create payload.
        required: true
      responses:
        '200':
          description: Request processed. See `status` field in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.CreateCertificateResponse'
        '400':
          description: Bad request. Fix the request and try again.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Create certificate
      tags:
        - Certificates
  /certificate/{certificate_seq}:
    delete:
      description: Deletes the certificate.
      operationId: deleteCertificate
      parameters:
        - description: Certificate sequence number.
          in: path
          name: certificate_seq
          required: true
          schema:
            type: integer
            format: int
      responses:
        '200':
          description: Request processed. See `status` field in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.DeleteCertificateResponse'
        '400':
          description: Bad request. Fix the request and try again.
        '404':
          description: Certificate has not been found.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Delete certificate
      tags:
        - Certificates
    get:
      description: Returns the certificate details.
      operationId: getCertificate
      parameters:
        - description: Certificate sequence number.
          in: path
          name: certificate_seq
          required: true
          schema:
            type: integer
            format: int
        - description: If true, certificate details (PEM content) will be included.
          in: query
          name: details
          schema:
            type: boolean
      responses:
        '200':
          description: Request processed. See `status` field in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.GetCertificateResponse'
        '400':
          description: Bad request. Fix the request and try again.
        '404':
          description: Certificate has not been found.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Get certificate
      tags:
        - Certificates
    patch:
      description: Updates an existing certificate.
      operationId: updateCertificate
      parameters:
        - description: Certificate sequence number.
          in: path
          name: certificate_seq
          required: true
          schema:
            type: integer
            format: int
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.UpdateCertificateRequest'
        description: Certificate update payload.
        required: true
      responses:
        '200':
          description: Request processed. See `status` field in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.UpdateCertificateResponse'
        '400':
          description: Bad request. Fix the request and try again.
        '404':
          description: Certificate has not been found.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Update certificate
      tags:
        - Certificates
  /letsencrypt:
    post:
      description: Creates a Let's Encrypt wildcard certificate order.
      operationId: orderWildcardLetsEncrypt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.LetsEncryptWildcardOrderRequest'
        description: Domains for a wildcard certificate.
        required: true
      responses:
        '200':
          description: Request processed. See `status` field in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.LetsEncryptWildcardOrderResponse'
        '400':
          description: Bad request. Fix the request and try again.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Order wildcard Let's Encrypt certificate
      tags:
        - LetsEncrypt
  /letsencrypt/{resource_id}:
    get:
      description: Returns the Let's Encrypt order status for the resource.
      operationId: getLetsEncryptStatus
      parameters:
        - description: CDN resource identifier.
          in: path
          name: resource_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request processed. See `status` field in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.LetsEncryptStatusResponse'
        '400':
          description: Bad request. Fix the request and try again.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Get Let's Encrypt status
      tags:
        - LetsEncrypt
    post:
      description: Creates a Let's Encrypt certificate order for an existing HTTP CDN resource.
      operationId: orderLetsEncrypt
      parameters:
        - description: CDN resource identifier.
          in: path
          name: resource_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request processed. See `status` field in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.LetsEncryptOrderResponse'
        '400':
          description: Bad request. Fix the request and try again.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Order Let's Encrypt certificate
      tags:
        - LetsEncrypt
  /nodes/ip2origin:
    get:
      description: Returns a list of IP addresses/subnets of nodes that can request content from the origin.
      operationId: listOriginNodes
      responses:
        '200':
          description: List of nodes that request content from origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.NodesResponse'
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: List origin nodes
      tags:
        - Nodes
  /nodes/ip2user:
    get:
      description: Returns a list of IP addresses of nodes that can deliver content to users for a specific domain.
      operationId: listDeliveryNodes
      parameters:
        - description: 'The primary (technical) CDN domain. Example: f5e45429-2216-4975-a4bb-2134383bd510.selcdn.net'
          in: query
          name: cdn-domain
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          description: List of nodes that deliver content to users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.NodesResponse'
        '404':
          description: Domain has not been found or is not owned by the account.
        '422':
          description: Validation error. Fix the request and try again.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: List delivery nodes
      tags:
        - Nodes
  /resources:
    get:
      description: Returns a list of resources in the project.
      operationId: listResources
      parameters:
        - description: Filter by active/deactivated resources.
          in: query
          name: active
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: List of resources has been returned.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/models.Resource'
                type: array
        '400':
          description: Bad request. Fix the request and try again.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: List resources
      tags:
        - Resources
    post:
      description: Creates an HTTP CDN resource for the project.
      operationId: createResource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.Resource'
        description: HTTP resource create payload.
        required: true
      responses:
        '200':
          description: Request processed. See `status` field in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.CreateUpdateResponse'
        '400':
          description: Bad request. Fix the request and try again.
        '403':
          description: Access is forbidden. Make sure you have the required rights.
        '404':
          description: Resource has not been found.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Create resource
      tags:
        - Resources
  /resources/{resource_id}:
    get:
      description: Returns the resource by its identifier.
      operationId: getResourceById
      parameters:
        - description: Resource identifier.
          in: path
          name: resource_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resource object has been returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Resource'
        '400':
          description: Bad request. Fix the request and try again.
        '404':
          description: Resource has not been found.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Get resource by identifier
      tags:
        - Resources
    patch:
      description: Partially updates the first-level fields of the HTTP resource with the payload from the request body.
      operationId: updateResourcePatch
      parameters:
        - description: Resource identifier.
          in: path
          name: resource_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.Resource'
        description: HTTP resource patch payload.
        required: true
      responses:
        '200':
          description: Request processed. See `status` field in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.CreateUpdateResponse'
        '400':
          description: Bad request. Fix the request and try again.
        '403':
          description: Access is forbidden. Make sure you have the required rights.
        '404':
          description: Resource has not been found.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Partially update resource
      tags:
        - Resources
    put:
      description: Fully replaces the HTTP resource configuration with the payload from the request body.
      operationId: updateResourcePut
      parameters:
        - description: Resource identifier.
          in: path
          name: resource_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.Resource'
        description: HTTP resource update payload.
        required: true
      responses:
        '200':
          description: Request processed. See `status` field in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.CreateUpdateResponse'
        '400':
          description: Bad request. Fix the request and try again.
        '403':
          description: Access is forbidden. Make sure you have the required rights.
        '404':
          description: Resource has not been found.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Fully update resource
      tags:
        - Resources
  /resources/{resource_id}/status:
    get:
      description: Returns status for the specified HTTP resource.
      operationId: getResourceStatus
      parameters:
        - description: Resource identifier.
          in: path
          name: resource_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status has been returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ResourceStatus'
        '400':
          description: Bad request. Fix the request and try again.
        '403':
          description: Access is forbidden. Make sure you have the required rights.
        '404':
          description: Resource has not been found.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Get resource status
      tags:
        - Resources
  /resources/status:
    get:
      description: Returns status for up to 50 HTTP resources. If `resource_id` is not provided, returns empty response.
      operationId: getResourcesStatus
      parameters:
        - description: Resource identifiers (up to 50).
          in: query
          name: resource_id
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Status has been returned.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/models.ResourceStatus'
                type: array
        '400':
          description: Bad request. Fix the request and try again.
        '403':
          description: Access is forbidden. Make sure you have the required rights.
        '404':
          description: Resource has not been found.
        '500':
          description: Server is not responding. Please try again later.
      security:
        - iam_token_project_scoped: []
      summary: Get resources status
      tags:
        - Resources
tags:
  - description: 'Managing CDN resources: viewing a list of resources, creating, updating, and deleting resources.'
    name: Resources
  - description: 'Managing cache tasks: deleting files from cache, preloading files into cache, and getting task execution status.'
    name: Cache
  - description: 'Managing SSL certificates: viewing a list of certificates, adding, updating, and deleting certificates.'
    name: Certificates
  - description: 'Retrieving CDN nodes: nodes that request content from origin and nodes that deliver content to users.'
    name: Nodes
  - description: 'Managing Let''s Encrypt certificates: ordering certificates for a resource, ordering wildcard certificates, and getting order status.'
    name: LetsEncrypt
servers:
  - url: /cdn/v3
components:
  securitySchemes:
    iam_token_project_scoped:
      description: IAM token for project
      in: header
      name: X-Auth-Token
      type: apiKey
  schemas:
    models.AWSAuth:
      properties:
        access_key:
          description: AWS access key identifier.
          type: string
        secret_key:
          description: AWS secret access key.
          type: string
      required:
        - access_key
        - secret_key
      type: object
    models.AuthMD5:
      properties:
        anywhere:
          default: false
          description: If `true`, the IP address will be ignored.
          type: boolean
        forever:
          default: false
          description: If `true`, no time limit will be applied.
          type: boolean
        secret:
          description: Secret word.
          type: string
      type: object
    models.CacheValid:
      properties:
        2xx:
          default: 24h
          description: |-
            Cache time for `2xx` codes.
            Pattern: `^(\d+)[smhd]$`.
          example: 1d
          type: string
        3xx:
          default: 1s
          description: |-
            Cache time for `3xx` codes.
            Pattern: `^(\d+)[smhd]$`.
          example: 1d
          type: string
        4xx:
          default: 5s
          description: |-
            Cache time for `4xx` codes.
            Pattern: `^(\d+)[smhd]$`.
          example: 1s
          type: string
        5xx:
          default: 1s
          description: |-
            Cache time for `5xx` codes.
            Pattern: `^(\d+)[smhd]$`.
          example: 1s
          type: string
        browser:
          description: |-
            Browser cache duration (works for status codes `200`, `201`, `204`, `206`, `301`, `302`, `303`, `304`, `307`, `308`).
            Pattern: `^(\d+)[smhd]$`.
          example: 1d
          type: string
        force:
          default: false
          description: If `true`, caching headers will be ignored.
          type: boolean
      type: object
    models.CertificateInfo:
      properties:
        alt:
          description: Alternative Names of the certificate.
          example: '*.test.com, test.com'
          type: string
        cn:
          description: Common Name of the certificate.
          example: '*.test.com'
          type: string
        comment:
          description: Certificate comment.
          example: july_23
          type: string
        end_iso8601:
          description: Certificate validity end date/time in the `ISO8601` format.
          example: '2023-07-17T05:13:02Z'
          type: string
        end_timestamp:
          description: Certificate validity end timestamp.
          example: 1689570782
          type: integer
        issuer:
          description: Certificate issuer.
          example: Let's Encrypt Authority X3
          type: string
        seq:
          description: Certificate sequence number (ID).
          example: 1
          type: integer
        start_iso8601:
          description: Certificate validity start date/time in the `ISO8601` format.
          example: '2022-06-15T05:13:03Z'
          type: string
        start_timestamp:
          description: Certificate validity start timestamp.
          example: 1655269983
          type: integer
      type: object
    models.CertificateInfoWithChain:
      properties:
        alt:
          description: Alternative Names of the certificate.
          example: '*.test.com, test.com'
          type: string
        chain_info:
          description: Certificate chain information.
          items:
            $ref: '#/components/schemas/models.ChainInfo'
          type: array
        cn:
          description: Common Name of the certificate.
          example: '*.test.com'
          type: string
        comment:
          description: Certificate comment.
          example: july_23
          type: string
        end_iso8601:
          description: Certificate validity end date/time in the `ISO8601` format.
          example: '2023-07-17T05:13:02Z'
          type: string
        end_timestamp:
          description: Certificate validity end timestamp.
          example: 1689570782
          type: integer
        issuer:
          description: Certificate issuer.
          example: Let's Encrypt Authority X3
          type: string
        seq:
          description: Certificate sequence number (ID).
          example: 1
          type: integer
        start_iso8601:
          description: Certificate validity start date/time in the `ISO8601` format.
          example: '2022-06-15T05:13:03Z'
          type: string
        start_timestamp:
          description: Certificate validity start timestamp.
          example: 1655269983
          type: integer
      type: object
    models.CertificateSeqData:
      properties:
        seq:
          description: Certificate sequence number (ID).
          example: 1
          type: integer
      type: object
    models.ChainInfo:
      properties:
        end_iso8601:
          description: Certificate validity end date/time in the `ISO8601` format.
          example: '2029-03-18T00:00:00Z'
          type: string
        end_timestamp:
          description: Certificate validity end timestamp.
          example: 1868475600
          type: integer
        fingerprint:
          description: Certificate fingerprint from the chain.
          example: 1C:61:0A:0A:87:D4:92:F4:83:22:C2:AF:D3:BE:9B:6A:D3:6B:6B:EE
          type: string
        issuer_CN:
          description: Issuer Common Name of the certificate from the chain.
          example: GlobalSign
          type: string
        serial:
          description: Serial Number of the certificate from the chain.
          example: 77:BD:0E:07:42:D5:D9:E9:D0:49:D7:74:D0:2A:6F:9A
          type: string
        start_iso8601:
          description: Certificate validity start date/time in the `ISO8601` format.
          example: '2020-07-28T00:00:00Z'
          type: string
        start_timestamp:
          description: Certificate validity start timestamp.
          example: 1595883600
          type: integer
        subject_CN:
          description: Subject Common Name of the certificate from the chain.
          example: GlobalSign GCC R3 DV TLS CA 2020
          type: string
      type: object
    models.CreateCertificateRequest:
      properties:
        certificate:
          description: Certificate text in `PEM` format.
          example: |-
            -----BEGIN CERTIFICATE-----
            MIIMvzCCC6egAwIBAgISBDOHrUbe+jaL2W0x4w3T5YuBMA0GCSqGSIb3DQEBCwUA
            -----END CERTIFICATE-----
          type: string
        comment:
          description: Certificate comment.
          example: new comment
          type: string
        private_key:
          description: Private key text in `PEM` format.
          example: |-
            -----BEGIN PRIVATE KEY-----
            MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQDQtDgBy3kRiv2
            -----END PRIVATE KEY-----
          type: string
      required:
        - certificate
        - comment
        - private_key
      type: object
    models.CreateCertificateResponse:
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/models.CertificateSeqData'
          description: Uploaded certificate information when `status` is `0`.
        message:
          description: Text description of the status.
          example: cert saved
          type: string
        status:
          description: |-
            Response status code:
            - `0` - cert saved;
            - `450` - Invalid request;
            - `455` - Not Allowed;
            - `459` - Certificate already exist, use `PATCH` to update certificate;
            - `471` - Invalid certificate;
            - `472` - Invalid private key;
            - `473` - Private key does not match certificate;
            - `474` - Certificate is expired;
            - `475` - Root certificate is not found in system trusted certificates;
            - `476` - One of certificates is not signed by previous certificate in chain;
            - `477` - Certificate has `N` invalid line(s);
            - `478` - Cert chain error: Two or more certificates have the same subject;
            - `479` - Cert chain error: Too many certificates have the same issuer;
            - `550` - Internal Server Error.
          example: 0
          type: integer
      type: object
    models.CreateTaskResponse:
      properties:
        task_id:
          description: Created task identifier.
          example: 30ee3d06-b7fa-4dc7-ba84-44f4aa5bfaf0
          type: string
      required:
        - task_id
      type: object
    models.CreateUpdateResponse:
      properties:
        cdn_domain:
          description: CDN domain of the created HTTP resource (set when `status` is `accept`).
          example: 6d19b7a2-a493-48fa-a9ec-aea7ba9ffa28.selcdn.net
          type: string
        description:
          description: Error description (set when `status` is `error`).
          example: Key incorrect or not found ( origin )
          type: string
        message:
          description: Error message (set when `status` is `error`).
          example: Json invalid
          type: string
        resource_id:
          description: Created HTTP resource identifier (set when `status` is `accept`).
          example: 6d19b7a2-a493-48fa-a9ec-aea7ba9ffa28
          type: string
        status:
          description: 'Operation status: `accept` or `error`.'
          enum:
            - accept
            - error
          type: string
        task_id:
          description: Configuration change task identifier (set when `status` is `accept`).
          example: '20180402162358692400'
          type: string
      type: object
    models.DeleteCertificateResponse:
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/models.CertificateSeqData'
