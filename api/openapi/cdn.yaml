          enum:
            - ok
            - in_queue
            - failed
            - processing
          example: ok
          type: string
        task:
          allOf:
            - $ref: '#/components/schemas/models.Task'
          description: Task information.
        task_id:
          description: Task identifier.
          example: 30ee3d06-b7fa-4dc7-ba84-44f4aa5bfaf0
          type: string
      required:
        - status
        - task
        - task_id
      type: object
    models.UpdateCertificateRequest:
      properties:
        certificate:
          description: New certificate text in `PEM` format (optional).
          example: |-
            -----BEGIN CERTIFICATE-----
            MIIMvzCCC6egAwIBAgISBDOHrUbe+jaL2W0x4w3T5YuBMA0GCSqGSIb3DQEBCwUA
            -----END CERTIFICATE-----
          type: string
        comment:
          description: New certificate comment (optional).
          example: new comment
          type: string
        private_key:
          description: New private key text in `PEM` format (optional).
          example: |-
            -----BEGIN PRIVATE KEY-----
            MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQDQtDgBy3kRiv2
            -----END PRIVATE KEY-----
          type: string
      type: object
    models.UpdateCertificateResponse:
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/models.CertificateSeqData'
          description: Updated certificate information when `status` is `0`.
        message:
          description: Text description of the status.
          example: cert updated
          type: string
        status:
          description: |-
            Response status code:
            - `0` - cert updated;
            - `450` - Invalid request;
            - `454` - Record not found in database;
            - `455` - Not Allowed;
            - `471` - Invalid certificate;
            - `472` - Invalid private key;
            - `473` - Private key does not match certificate;
            - `474` - Certificate is expired;
            - `475` - Root certificate is not found in system trusted certificates;
            - `476` - One of certificates is not signed by previous certificate in chain;
            - `477` - Certificate has `N` invalid line(s);
            - `550` - Internal Server Error.
          example: 0
          type: integer
      type: object
    models.UserAgentExclude:
      properties:
        useragent:
          description: UserAgent or regular expression.
          example: browser_name
          type: string
      type: object
    models.UserAgentLimitation:
      properties:
        default_action:
          description: 'Default action: `allow` or `deny`.'
          enum:
            - allow
            - deny
          type: string
        exclude:
          description: Exceptions.
          items:
            $ref: '#/components/schemas/models.UserAgentExclude'
          type: array
        times:
          description: Time intervals for the restriction.
          items:
            $ref: '#/components/schemas/models.LimitationTime'
          type: array
      type: object
