---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: projects.selectel.tapclap.com
spec:
  group: selectel.tapclap.com
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Project is a cluster-scoped Selectel project credential and access
          policy.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Project
            properties:
              allowedNamespaces:
                description: |-
                  allowedNamespaces lists namespaces that may reference this Project.
                  An empty list allows none. A namespace entry replaces a "*" entry and does not inherit its certificates or domains.
                items:
                  description: |-
                    NamespaceAccess grants one namespace, or every namespace when name is "*",
                    the right to use this Project and an explicit set of certificates and personal domains.
                  properties:
                    certificates:
                      description: |-
                        certificates lists Selectel certificate seq values this namespace may attach.
                        An empty list allows CDN resources without a custom certificate.
                      items:
                        description: |-
                          AllowedCertificate is a Selectel CDN certificate sequence the namespace may bind.
                          The object shape leaves room for a future reference to a Certificate in the cluster.
                        properties:
                          id:
                            description: id is the certificate seq in the Selectel
                              CDN API.
                            format: int32
                            minimum: 1
                            type: integer
                        required:
                        - id
                        type: object
                      type: array
                    domains:
                      description: |-
                        domains lists personal domains spec.names may use in this namespace.
                        An empty list allows no personal domain. A pattern is an exact name, a glob, or a /regex/.
                      items:
                        type: string
                      type: array
                    name:
                      description: name is a namespace name. "*" matches every namespace
                        that has no own entry.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
              authURL:
                description: authURL is the Keystone identity root. Defaults to https://cloud.api.selcloud.ru/identity/v3.
                type: string
              credentialsSecretRef:
                description: credentialsSecretRef is the Secret with accountId, username,
                  password, and projectName.
                properties:
                  name:
                    description: name of the Secret.
                    minLength: 1
                    type: string
                  namespace:
                    description: namespace of the Secret. It must be the operator
                      credentials namespace.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - credentialsSecretRef
            type: object
          status:
            description: status defines the observed state of Project
            properties:
              conditions:
                description: conditions represent the current state of the Project
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
