apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "selectel-operator.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "selectel-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
